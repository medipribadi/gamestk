<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game 5 - Belajar Mengaji Interaktif</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:'Fredoka',sans-serif;

  background:
  linear-gradient(
    180deg,
    #d8ffe3,
    #f7ffe8
  );

   overflow-x:hidden;
  overflow-y:auto;

  color:#234;
}

.container{

  width:100%;
  min-height:100vh;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  padding:20px;

  position:relative;
}

/* HEADER */

.title{

  font-size:58px;

  color:#0d7c3b;

  margin-bottom:10px;

  text-shadow:
  0 5px 10px rgba(0,0,0,0.12);
}

.subtitle{

  color:#4d6b57;

  font-size:20px;

  margin-bottom:35px;

  text-align:center;
}

/* CARD */

.game-card{

  width:100%;
  max-width:700px;

  background:white;

  border-radius:35px;

  padding:40px 30px;

    padding-bottom:80px;

  box-shadow:
  0 15px 35px rgba(0,0,0,0.1);

  text-align:center;

  border:
  5px solid #ffe082;

  position:relative;
}

/* SCORE */

.top-ui{

  position:absolute;

  top:20px;
  left:20px;

  background:white;

  padding:14px 22px;

  border-radius:18px;

  box-shadow:
  0 8px 20px rgba(0,0,0,0.1);

  font-size:22px;

  font-weight:700;

  z-index:20;
}

/* HIJAIYAH */

.huruf-box{

  margin-top:25px;

  margin-bottom:25px;
}

.huruf{

  font-size:150px;

  color:#0d7c3b;

  text-shadow:
  0 10px 20px rgba(0,0,0,0.1);

  animation:
  pulse 2s infinite;
}

@keyframes pulse{

  0%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.08);
  }

  100%{
    transform:scale(1);
  }
}

.latin{

  margin-top:10px;

  font-size:32px;

  color:#f57c00;

  font-weight:700;
}

/* BUTTONS */

.buttons{

  display:flex;

  justify-content:center;

  gap:20px;

  flex-wrap:wrap;

  margin-top:35px;
}

button{

  border:none;

  padding:
  18px 34px;

  border-radius:999px;

  font-size:20px;

  font-family:'Fredoka',sans-serif;

  font-weight:700;

  cursor:pointer;

  transition:0.3s;
}

button:hover{

  transform:
  scale(1.06);
}

.listen-btn{

  background:#4caf50;

  color:white;
}

.mic-btn{

  background:#ff9800;

  color:white;
}

.next-btn{

  background:#2196f3;

  color:white;
}

/* STATUS */

.status{

  margin-top:35px;

  font-size:28px;

  font-weight:700;

  min-height:40px;
}

/* STAR */

.star{

  position:absolute;

  font-size:26px;

  animation:
  floatStar 6s linear infinite;

  opacity:0.6;
}

@keyframes floatStar{

  from{
    transform:
    translateY(0px);
  }

  to{
    transform:
    translateY(-100vh);
  }
}

/* LEADERBOARD */

.leaderboard{

  position:absolute;

  top:20px;
  right:20px;

  width:240px;

  background:white;

  border-radius:25px;

  padding:22px;

  box-shadow:
  0 10px 25px rgba(0,0,0,0.1);
}

.leaderboard h3{

  margin-bottom:12px;

  color:#ff9800;
}

/* RESPONSIVE */

@media(max-width:768px){

  .title{

    font-size:38px;
  }

  .subtitle{

    font-size:16px;
  }

  .huruf{

    font-size:100px;
  }

  .latin{

    font-size:24px;
  }

  .game-card{

    padding:30px 18px;
  }

  button{

    width:100%;
  }

  .leaderboard{

    position:relative;

    width:100%;

    margin-top:25px;

    right:auto;
    top:auto;
  }

  .top-ui{

    position:relative;

    top:auto;
    left:auto;

    margin-bottom:20px;
  }
}

</style>
</head>

<body>

<div class="container">

<div class="top-ui">
⭐ Score: <span id="score">0</span>
</div>

<div class="leaderboard">

<h3>🏆 Top Score</h3>

<div id="topPlayers">
Belum ada data
</div>

</div>

<div class="star" style="left:10%; top:80%;">✨</div>
<div class="star" style="left:80%; top:70%;">⭐</div>
<div class="star" style="left:60%; top:90%;">🌙</div>

<h1 class="title">
📖 Belajar Mengaji Interaktif
</h1>

<p class="subtitle">
Belajar huruf hijaiyah sambil berbicara 🎤
</p>

<div class="game-card">

<div class="huruf-box">

<div class="huruf" id="huruf">
ا
</div>

<div class="latin" id="latin">
Alif
</div>

</div>

<div class="buttons">

<button
class="listen-btn"
onclick="playSound()">

🔊 Dengarkan

</button>

<button
class="mic-btn"
onclick="startRecognition()">

🎤 Sebutkan

</button>

<button
class="next-btn"
onclick="nextHuruf()">

➡ Berikutnya

</button>

<button
  id="nextLevelBtn"
  class="next-btn"
  style="display:none;"
  onclick="nextLevel()">

  🚀 Next Level

</button>

</div>

<div class="status" id="status">

Ayo belajar 😊

</div>

</div>

</div>

<script>

const levels = [

/* LEVEL 1 */

[
{ arab:"ا", latin:"Alif" },
{ arab:"ب", latin:"Ba" },
{ arab:"ت", latin:"Ta" },
{ arab:"ث", latin:"Tsa" },
{ arab:"ج", latin:"Jim" },
{ arab:"ح", latin:"Ha" },
{ arab:"خ", latin:"Kho" },
{ arab:"د", latin:"Dal" },
{ arab:"ذ", latin:"Dzal" },
{ arab:"ر", latin:"Ro" },
{ arab:"ز", latin:"Za" },
{ arab:"س", latin:"Sin" },
{ arab:"ش", latin:"Syin" },
{ arab:"ص", latin:"Shod" },
{ arab:"ض", latin:"Dhod" },
{ arab:"ط", latin:"Tho" },
{ arab:"ظ", latin:"Zho" },
{ arab:"ع", latin:"Ain" },
{ arab:"غ", latin:"Ghain" },
{ arab:"ف", latin:"Fa" },
{ arab:"ق", latin:"Qof" },
{ arab:"ك", latin:"Kaf" },
{ arab:"ل", latin:"Lam" },
{ arab:"م", latin:"Mim" },
{ arab:"ن", latin:"Nun" },
{ arab:"و", latin:"Wawu" },
{ arab:"ه", latin:"Hamzah" },
{ arab:"ي", latin:"Ya" }
],

/* LEVEL 2 */

[
{ arab:"بَ", latin:"Ba" },
{ arab:"بِ", latin:"Bi" },
{ arab:"بُ", latin:"Bu" },

{ arab:"تَ", latin:"Ta" },
{ arab:"تِ", latin:"Ti" },
{ arab:"تُ", latin:"Tu" },

{ arab:"جَ", latin:"Ja" },
{ arab:"جِ", latin:"Ji" },
{ arab:"جُ", latin:"Ju" },

{ arab:"دَ", latin:"Da" },
{ arab:"دِ", latin:"Di" },
{ arab:"دُ", latin:"Du" },

{ arab:"رَ", latin:"Ra" },
{ arab:"رِ", latin:"Ri" },
{ arab:"رُ", latin:"Ru" },

{ arab:"سَ", latin:"So" },
{ arab:"سِ", latin:"Si" },
{ arab:"سُ", latin:"Su" },

{ arab:"لَ", latin:"La" },
{ arab:"لِ", latin:"Li" },
{ arab:"لُ", latin:"Lu" },

{ arab:"مَ", latin:"Ma" },
{ arab:"مِ", latin:"Mi" },
{ arab:"مُ", latin:"Mu" },

{ arab:"نَ", latin:"Na" },
{ arab:"نِ", latin:"Ni" },
{ arab:"نُ", latin:"Nu" },
/* WAW */
{ arab:"وَ", latin:"Wa" },
{ arab:"وِ", latin:"Wi" },
{ arab:"وُ", latin:"Wu" },

/* HA */
{ arab:"هَ", latin:"Ha" },
{ arab:"هِ", latin:"Hi" },
{ arab:"هُ", latin:"Hu" },

/* YA */
{ arab:"يَ", latin:"Ya" },
{ arab:"يِ", latin:"Yi" },
{ arab:"يُ", latin:"Yu" }


]

];

let current = 0;
let currentLevel = 0;
let score = 0;
let playerName = "";
let questions = [];

/* RANDOM LEVEL 2 */

function generateQuestions(){

  const data =
    [...levels[1]];

  // fisher yates shuffle
  for(
    let i = data.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [data[i], data[j]] =
    [data[j], data[i]];
  }

  questions =
    data.slice(0,10);
}
generateQuestions();

const huruf =
document.getElementById("huruf");

const latin =
document.getElementById("latin");

const statusText =
document.getElementById("status");

const scoreText =
document.getElementById("score");

/* LOAD */

function loadHuruf(){

  let item;

  if(currentLevel == 0){

    item =
      levels[0][current];

  }else{

    item =
      questions[current];
  }

  huruf.innerText =
    item.arab;

  latin.innerText =
    item.latin;

  statusText.innerHTML =
    `🎯 Bacanya:
    <b>${item.latin}</b>`;
}
askPlayerName();
loadHuruf();
showLeaderboard();
/* NEXT */

function nextHuruf(){

  score--;

  if(score < 0){

    score = 0;
  }

  scoreText.innerText =
    score;

  current++;

  let total;

  if(currentLevel == 0){

    total =
      levels[0].length;

  }else{

    total =
      questions.length;
  }

  if(current >= total){

    current = 0;

    if(currentLevel == 0){

      document.getElementById(
        "nextLevelBtn"
      ).style.display =
      "inline-block";

      statusText.innerHTML =
        "🎉 Level 1 selesai!";

    }else{
saveScore();
      statusText.innerHTML =
        
`
🏆 Semua level selesai!<br><br>

<button onclick="restartGame()"
style="
padding:14px 28px;
border:none;
border-radius:999px;
background:#4caf50;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin:10px;
">

🔄 Main Lagi

</button>

<button onclick="backHome()"
style="
padding:14px 28px;
border:none;
border-radius:999px;
background:#ff9800;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin:10px;
">

🏠 Kembali Home

</button>
`;
    }

    return;
  }

  loadHuruf();
}

/* PLAY SOUND */

function playSound(){

  let text;

  if(currentLevel == 0){

    text =
      levels[0][current].latin;

  }else{

    text =
      questions[current].latin;
  }

  const speech =
  new SpeechSynthesisUtterance(
    text
  );

  speech.lang =
    "id-ID";

  speech.pitch = 0.9;

  speech.rate = 0.7;

  speech.volume = 1;

  speechSynthesis.speak(
    speech
  );
}

/* VOICE */

function startRecognition(){

  if(
    !(
      'webkitSpeechRecognition'
      in window
    )
  ){

    alert(
      "Browser tidak support 😭"
    );

    return;
  }

  const recognition =
    new webkitSpeechRecognition();

  recognition.lang =
    "id-ID";

  recognition.start();

  statusText.innerHTML =
    "🎤 Mendengarkan...";

  recognition.onresult =
  function(event){

    const result =
      event.results[0][0]
      .transcript
      .toLowerCase();

    let jawaban;

    if(currentLevel == 0){

      jawaban =
      levels[0][current]
      .latin
      .toLowerCase();

    }else{

      jawaban =
      questions[current]
      .latin
      .toLowerCase();
    }

    if(
      result.includes(jawaban)
    ){

      score += 10;

      if(score > 100){

        score = 100;
      }

      scoreText.innerText =
        score;

      statusText.innerHTML =
        "✅ Benar 😍";

      confettiEffect();

      setTimeout(()=>{

        current++;

        let total;

        if(currentLevel == 0){

          total =
          levels[0].length;

        }else{

          total =
          questions.length;
        }

        if(current >= total){

          current = 0;

          if(currentLevel == 0){

            document.getElementById(
              "nextLevelBtn"
            ).style.display =
            "inline-block";

            statusText.innerHTML =
              "🎉 Level 1 selesai!";

          }else{
saveScore();
            statusText.innerHTML =
              
`
🏆 Semua level selesai!<br><br>

<button onclick="restartGame()"
style="
padding:14px 28px;
border:none;
border-radius:999px;
background:#4caf50;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin:10px;
">

🔄 Main Lagi

</button>

<button onclick="backHome()"
style="
padding:14px 28px;
border:none;
border-radius:999px;
background:#ff9800;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin:10px;
">

🏠 Kembali Home

</button>
`;
          }

          return;
        }

        loadHuruf();

      },1200);

    }else{

      statusText.innerHTML =
        "❌ Salah 😊";
    }
  };
}

/* EFFECT */

function confettiEffect(){

  for(let i=0;i<15;i++){

    const div =
      document.createElement("div");

    div.innerHTML =
      ["⭐","✨","🎉"]
      [
        Math.floor(
          Math.random()*3
        )
      ];

    div.style.position =
      "fixed";

    div.style.left =
      Math.random()*100
      + "vw";

    div.style.top =
      "100vh";

    div.style.fontSize =
      "35px";

    div.style.zIndex =
      "999";

    div.style.transition =
      "3s linear";

    document.body
    .appendChild(div);

    setTimeout(()=>{

      div.style.transform =
        `translateY(-120vh)
        rotate(720deg)`;

    },50);

    setTimeout(()=>{

      div.remove();

    },3000);
  }
}

/* NEXT LEVEL */

function nextLevel(){

  currentLevel = 1;

  current = 0;

  generateQuestions();

  document.getElementById(
    "nextLevelBtn"
  ).style.display =
  "none";

  statusText.innerHTML =
    "🚀 Level Harokat";

  loadHuruf();
}

/* TOP PLAYER */

document.getElementById(
  "topPlayers"
).innerHTML =

`
1. Aisyah ⭐<br><br>
2. Rizki 🌙<br><br>
3. Nabila ✨
`;
function restartGame(){

  currentLevel = 0;

  current = 0;

  score = 0;

  scoreText.innerText =
    score;

  document.getElementById(
    "nextLevelBtn"
  ).style.display = "none";

  loadHuruf();

  statusText.innerHTML =
    "😊 Ayo belajar lagi!";
}

function backHome(){

  window.location.href =
    "index.html";
}

function askPlayerName(){

  playerName =
    prompt(
      "😊 Siapa nama kamu?"
    );

  if(
    !playerName ||
    playerName.trim() == ""
  ){

    playerName =
      "Player";
  }
}

function saveScore(){

  let data =
    JSON.parse(
      localStorage.getItem(
        "topPengaji"
      )
    ) || [];

  data.push({

    name: playerName,

    score: score
  });

  data.sort(
    (a,b)=>
    b.score - a.score
  );

  data =
    data.slice(0,3);

  localStorage.setItem(
    "topPengaji",
    JSON.stringify(data)
  );

  showLeaderboard();
}

function showLeaderboard(){

  const data =
    JSON.parse(
      localStorage.getItem(
        "topPengaji"
      )
    ) || [];

  const top =
    document.getElementById(
      "topPlayers"
    );

  if(data.length == 0){

    top.innerHTML =
      "Belum ada data 😄";

    return;
  }

  top.innerHTML =
    data.map((p,i)=>`

      <div style="
      margin-bottom:18px;
      font-size:22px;
      ">

      ${i+1}. ${p.name}
      ⭐ ${p.score}

      </div>

    `).join("");
}
</script>

</body>
</html>
