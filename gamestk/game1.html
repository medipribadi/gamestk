<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bubble Shooter Dor Dor Dor</title>

<style>

body{
  margin:0;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#87CEEB;
}

canvas{
  display:block;
}

.ui{
  position:absolute;
  top:15px;
  left:15px;
  z-index:10;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.box{
  background:white;
  padding:10px 16px;
  border-radius:15px;
  font-weight:bold;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.title{
  position:absolute;
  top:15px;
  width:100%;
  text-align:center;
  font-size:34px;
  font-weight:bold;
  color:white;
  text-shadow:2px 2px 5px rgba(0,0,0,0.3);
  z-index:10;
}

.combo{
  position:absolute;
  top:80px;
  width:100%;
  text-align:center;
  font-size:34px;
  font-weight:bold;
  color:white;
  text-shadow:3px 3px 8px rgba(0,0,0,0.5);
  z-index:10;
}

.leaderboard{
  position:absolute;
  top:15px;
  right:15px;
  z-index:10;
  background:white;
  padding:15px;
  border-radius:20px;
  width:220px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.leaderboard h3{
  margin-top:0;
  color:#ff4081;
}

.popup{

  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.5);

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:100;
}

.popup-box{

  background:white;
  padding:30px;
  border-radius:25px;
  text-align:center;
  width:300px;
}

.popup input{

  width:220px;
  padding:12px;
  border-radius:12px;
  border:2px solid #ddd;
  margin-top:15px;
  font-size:18px;
}

.popup button{

  margin-top:15px;
  padding:12px 20px;
  border:none;
  background:#ff9800;
  color:white;
  border-radius:15px;
  font-size:18px;
  cursor:pointer;
}

.end-buttons{

  position:absolute;
  inset:0;

  display:none;
  align-items:center;
  justify-content:center;
  gap:20px;

  z-index:200;
}

.end-buttons button{

  padding:15px 25px;
  border:none;
  border-radius:20px;

  font-size:22px;
  font-weight:bold;

  cursor:pointer;

  background:white;

  box-shadow:0 5px 15px rgba(0,0,0,0.3);

  transition:0.2s;
}

.end-buttons button:hover{

  transform:scale(1.1);
}

</style>
</head>

<body>

<div class="popup" id="startPopup">

  <div class="popup-box">

    <h2>🎮 Selamat Datang</h2>

    <p>Masukkan Nama Kamu 😊</p>

    <input
      type="text"
      id="playerName"
      placeholder="Nama pemain"
    >

    <button onclick="startGame()">
      ▶ Mulai Bermain
    </button>

  </div>

</div>

<div class="ui">

  <div class="box">
    ⭐ Score:
    <span id="score">0</span>/100
  </div>

  <div class="box">
    ⏱ Waktu:
    <span id="timer">00:00</span>
  </div>

</div>

<div class="leaderboard">

  <h3>🏆 Top 3 Tercepat</h3>

  <div id="leaderboardList">
    Belum ada data
  </div>

</div>

<div class="title">
🔫 Bubble Shooter 🔫
</div>

<div class="combo" id="comboText"></div>
<div id="endButtons" class="end-buttons">

  <button onclick="restartGame()">
    🔄 Main Lagi
  </button>

  <button onclick="goMenu()">
    🏠 Menu Utama
  </button>

</div>
<video
  id="input_video"
  autoplay
  playsinline
  style="
    position:absolute;
    bottom:20px;
    right:20px;
    width:220px;
    border-radius:20px;
    border:4px solid white;
    z-index:50;
  ">
</video>
<canvas id="game"></canvas>

<script>

  function restartGame(){

  location.reload();
}

function goMenu(){

  window.location.href = "index.html";
}

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const radius = 24;

const colors = [
  "#ff4d6d",
  "#4dabf7",
  "#51cf66",
  "#ffd43b"
];

let score = 0;
let comboCount = 0;

let gameStarted = false;
let gameOver = false;
let win = false;

let playerName = "";

let seconds = 0;

const WIN_SCORE = 100;

const bubbles = [];

const cols = 8;
const spacing = 55;

const startX =
  (canvas.width - ((cols-1)*spacing))/2;

function randomColor(){

  return colors[
    Math.floor(Math.random()*colors.length)
  ];
}

for(let row=0; row<4; row++){

  for(let col=0; col<cols; col++){

    bubbles.push({

      x: startX + col*spacing,
      y: 80 + row*50,
      color: randomColor()
    });
  }
}

let shooter = {

  x: canvas.width/2,
  y: canvas.height-90,
  angle: 0,
  bubble: randomColor()
};

let bullet = null;

function startGame(){

  const input =
    document.getElementById("playerName");

  if(input.value.trim() == ""){

    alert("Masukkan nama dulu 😊");
    return;
  }

  playerName = input.value;

  document.getElementById(
    "startPopup"
  ).style.display = "none";

  gameStarted = true;
}

setInterval(()=>{

  if(gameStarted && !gameOver && !win){

    seconds++;

    const min =
      String(Math.floor(seconds/60))
      .padStart(2,"0");

    const sec =
      String(seconds%60)
      .padStart(2,"0");

    document.getElementById(
      "timer"
    ).innerText = `${min}:${sec}`;
  }

},1000);

canvas.addEventListener("mousemove",(e)=>{

  const dx = e.clientX - shooter.x;
  const dy = e.clientY - shooter.y;

  shooter.angle = Math.atan2(dy,dx);
});

canvas.addEventListener("click",()=>{

  if(
    !gameStarted ||
    gameOver ||
    win
  ) return;

  if(!bullet){

    bullet = {

      x: shooter.x,
      y: shooter.y,
      color: shooter.bubble,

      dx: Math.cos(shooter.angle)*13,
      dy: Math.sin(shooter.angle)*13  
    };

    shooter.bubble = randomColor();
  }
});

function drawBackground(){

  const bg = ctx.createLinearGradient(
    0,0,0,canvas.height
  );

  bg.addColorStop(0,"#87CEEB");
  bg.addColorStop(1,"#FFE8B5");

  ctx.fillStyle = bg;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );
}

function drawBubble(x,y,color){

  const glow = ctx.createRadialGradient(
    x-8,y-8,5,
    x,y,30
  );

  glow.addColorStop(0,"white");
  glow.addColorStop(1,color);

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    radius,
    0,
    Math.PI*2
  );

  ctx.fillStyle = glow;
  ctx.fill();

  ctx.strokeStyle = "white";
  ctx.lineWidth = 3;
  ctx.stroke();
}

function drawAimLine(){

  ctx.beginPath();

  ctx.moveTo(
    shooter.x,
    shooter.y
  );

  const lineX =
    shooter.x + Math.cos(shooter.angle)*180;

  const lineY =
    shooter.y + Math.sin(shooter.angle)*180;

  ctx.lineTo(lineX,lineY);

  ctx.strokeStyle =
    "rgba(255,255,255,0.7)";

  ctx.lineWidth = 4;

  ctx.setLineDash([5,8]);

  ctx.stroke();

  ctx.setLineDash([]);
}

function getNeighbors(target){

  return bubbles.filter(other=>{

    if(other === target)
      return false;

    const dx =
      target.x - other.x;

    const dy =
      target.y - other.y;

    const dist =
      Math.sqrt(dx*dx + dy*dy);

    // toleransi lebih besar

    return dist <= radius*2.6;
  });
}

function findMatches(startBubble){

  const stack = [startBubble];
  const visited = [];

  while(stack.length){

    const current = stack.pop();

    if(visited.includes(current))
      continue;

    visited.push(current);

    const neighbors =
      getNeighbors(current);

    neighbors.forEach(n=>{

      if(
        n.color === startBubble.color &&
        !visited.includes(n)
      ){

        stack.push(n);
      }
    });
  }

  return visited;
}

function removeFloatingBubbles(){

  const connected = [];

  function dfs(bubble){

    if(connected.includes(bubble))
      return;

    connected.push(bubble);

    const neighbors =
      getNeighbors(bubble);

    neighbors.forEach(n=>{

      dfs(n);
    });
  }

  bubbles.forEach(b=>{

    if(b.y <= 100){

      dfs(b);
    }
  });

  let floatingCount = 0;

  for(let i=bubbles.length-1;i>=0;i--){

    if(!connected.includes(bubbles[i])){

      bubbles.splice(i,1);

      floatingCount++;
    }
  }

  if(floatingCount >= 2){

    comboCount++;

    let comboText = "";

    if(comboCount == 1){

      comboText =
        "🔥 COMBO x2 🔥";
    }
    else if(comboCount == 2){

      comboText =
        "🚀 COMBO x3 🚀";
    }
    else{

      comboText =
        "💥 ULTRA COMBO 💥";
    }

    document.getElementById(
      "comboText"
    ).innerText = comboText;

    score += floatingCount * 5;

    if(score > 100)
      score = 100;

    document.getElementById(
      "score"
    ).innerText = score;

    setTimeout(()=>{

      document.getElementById(
        "comboText"
      ).innerText = "";

    },1500);

  }else{

    comboCount = 0;
  }
}

function saveLeaderboard(){

  const leaderboard =
    JSON.parse(
      localStorage.getItem(
        "bubbleLeaderboard"
      )
    ) || [];

  leaderboard.push({

    name: playerName,
    time: seconds
  });

  leaderboard.sort((a,b)=>
    a.time - b.time
  );

  leaderboard.splice(3);

  localStorage.setItem(
    "bubbleLeaderboard",
    JSON.stringify(leaderboard)
  );

  renderLeaderboard();
}

function renderLeaderboard(){

  const leaderboard =
    JSON.parse(
      localStorage.getItem(
        "bubbleLeaderboard"
      )
    ) || [];

  const el =
    document.getElementById(
      "leaderboardList"
    );

  if(leaderboard.length == 0){

    el.innerHTML =
      "Belum ada data";

    return;
  }

  el.innerHTML = "";

  leaderboard.forEach((p,i)=>{

    const min =
      String(Math.floor(p.time/60))
      .padStart(2,"0");

    const sec =
      String(p.time%60)
      .padStart(2,"0");

    el.innerHTML += `
      <p>
        ${i+1}. ${p.name}
        - ${min}:${sec}
      </p>
    `;
  });
}

renderLeaderboard();

setInterval(()=>{

  if(
    gameStarted &&
    !gameOver &&
    !win
  ){

    bubbles.forEach(b=>{

      b.y += 50;
    });

    for(let col=0; col<cols; col++){

      bubbles.push({

        x: startX + col*spacing,
        y: 60,
        color: randomColor()
      });
    }
  }

},30000);

function update(){

  drawBackground();

  ctx.beginPath();

  ctx.moveTo(
    0,
    canvas.height-180
  );

  ctx.lineTo(
    canvas.width,
    canvas.height-180
  );

  ctx.strokeStyle = "red";
  ctx.lineWidth = 5;
  ctx.stroke();

  bubbles.forEach(b=>{

    drawBubble(
      b.x,
      b.y,
      b.color
    );

    if(
      b.y + radius >
      canvas.height-180
    ){

      gameOver = true;
    }
  });

  drawAimLine();

  ctx.save();

  ctx.translate(
    shooter.x,
    shooter.y
  );

  ctx.rotate(shooter.angle);

  ctx.fillStyle = "white";

  ctx.fillStyle = "#ffffff";

ctx.beginPath();

ctx.roundRect(
  0,
  -8,
  80,
  16,
  10
);

ctx.fill();

// ujung cannon

ctx.beginPath();

ctx.arc(
  82,
  0,
  10,
  0,
  Math.PI*2
);

ctx.fillStyle = "#ff9800";
ctx.fill();

  ctx.restore();

  drawBubble(
    shooter.x,
    shooter.y,
    shooter.bubble
  );

  if(bullet){

    bullet.x += bullet.dx;
    bullet.y += bullet.dy;

    if(
      bullet.x < radius ||
      bullet.x > canvas.width-radius
    ){

      bullet.dx *= -1;
    }

    drawBubble(
      bullet.x,
      bullet.y,
      bullet.color
    );

    for(let i=0;i<bubbles.length;i++){

      const b = bubbles[i];

      const dist = Math.hypot(

        bullet.x - b.x,
        bullet.y - b.y
      );

      if(dist < radius*2.3){

        const angle =
  Math.atan2(
    bullet.y - b.y,
    bullet.x - b.x
  );

const snapX =
  b.x + Math.cos(angle)*(radius*1.9);

const snapY =
  b.y + Math.sin(angle)*(radius*1.9);

bubbles.push({

  x: snapX,
  y: snapY,
  color: bullet.color
});

        const newBubble =
          bubbles[bubbles.length-1];

        const matches =
          findMatches(newBubble);

        if(matches.length >= 3){

          matches.forEach(m=>{

            const index =
              bubbles.indexOf(m);

            if(index !== -1){

              bubbles.splice(index,1);
            }
          });

          removeFloatingBubbles();

const explodedCount =
  matches.length;

let comboText = "";
let points = 10;

// combo logic

if(explodedCount >= 4 &&
   explodedCount <= 5){

  comboText =
    "🔥 COMBO x2 🔥";

  points = 20;
}

else if(explodedCount >= 6 &&
        explodedCount <= 7){

  comboText =
    "🚀 COMBO x3 🚀";

  points = 30;
}

else if(explodedCount >= 8){

  comboText =
    "💥 ULTRA COMBO 💥";

  points = 50;
}

// tampilkan combo

if(comboText != ""){

  document.getElementById(
    "comboText"
  ).innerText = comboText;

  setTimeout(()=>{

    document.getElementById(
      "comboText"
    ).innerText = "";

  },1500);
}

// tambah score

score += points;

if(score > 100)
  score = 100;

document.getElementById(
  "score"
).innerText = score;

          if(score >= WIN_SCORE){

            win = true;

            saveLeaderboard();
          }
        }

        bullet = null;
        break;
      }
    }

    if(
      bullet &&
      bullet.y < radius
    ){

      bubbles.push({

        x: bullet.x,
        y: bullet.y,
        color: bullet.color
      });

      bullet = null;
    }
  }

  if(win){

    ctx.fillStyle =
    "rgba(0,0,0,0.5)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle = "white";

  ctx.font =
    "bold 60px Arial";

  ctx.textAlign = "center";

  ctx.fillText(

    `🎉 ${playerName} MENANG 🎉`,

    canvas.width/2,
    canvas.height/2 - 50
  );

  // tombol

  document.getElementById(
    "endButtons"
  ).style.display = "flex";
}

  if(gameOver){

  ctx.fillStyle =
    "rgba(0,0,0,0.5)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle = "white";

  ctx.font =
    "bold 60px Arial";

  ctx.textAlign = "center";

  ctx.fillText(

    "💀 GAME OVER 💀",

    canvas.width/2,
    canvas.height/2 - 50
  );

  // tombol

  document.getElementById(
    "endButtons"
  ).style.display = "flex";
}

  requestAnimationFrame(update);
}
const videoElement =
  document.getElementById(
    'input_video'
  );

const hands = new Hands({

  locateFile: (file) => {

    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
  }
});

hands.setOptions({

  maxNumHands: 1,

  modelComplexity: 1,

  minDetectionConfidence: 0.7,

  minTrackingConfidence: 0.7
});

// hasil tracking tangan

hands.onResults((results)=>{

  if(results.multiHandLandmarks &&
     results.multiHandLandmarks.length > 0){

    const landmarks =
      results.multiHandLandmarks[0];

    // ujung telunjuk

    const finger =
      landmarks[8];

    // convert ke posisi layar

    const handX =
      finger.x * canvas.width;

    const handY =
      finger.y * canvas.height;

    // arah aim

    const dx =
      handX - shooter.x;

    const dy =
      handY - shooter.y;

    shooter.angle =
      Math.atan2(dy,dx);
  }
});

// aktifkan kamera

const camera = new Camera(
  videoElement,
  {

    onFrame: async ()=>{

      await hands.send({

        image: videoElement
      });
    },

    width: 640,
    height: 480
  }
);

camera.start();
update();

</script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

</body>
</html>
