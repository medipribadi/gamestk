<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Bubble Shooter TK</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#87CEEB;
}

canvas{
  display:block;
}

/* UI */

.title{
  position:absolute;
  top:20px;
  width:100%;
  text-align:center;

  font-size:52px;
  font-weight:bold;

  color:white;

  text-shadow:
    0 4px 10px rgba(0,0,0,0.3);

  z-index:20;
}

.left-ui{
  position:absolute;
  top:15px;
  left:15px;

  display:flex;
  flex-direction:column;
  gap:12px;

  z-index:20;
}

.ui-box{
  background:white;

  padding:12px 18px;

  border-radius:20px;

  font-size:20px;
  font-weight:bold;

  box-shadow:
    0 5px 15px rgba(0,0,0,0.2);
}

.leaderboard{
  position:absolute;

  top:15px;
  right:15px;

  width:240px;

  background:white;

  padding:18px;

  border-radius:25px;

  box-shadow:
    0 5px 15px rgba(0,0,0,0.2);

  z-index:20;
}

.leaderboard h3{
  margin-bottom:12px;
  color:#ff4081;
}

.combo{
  position:absolute;

  top:110px;
  width:100%;

  text-align:center;

  font-size:42px;
  font-weight:bold;

  color:white;

  text-shadow:
    0 4px 12px rgba(0,0,0,0.5);

  z-index:30;

  pointer-events:none;
}

/* popup */

.popup{
  position:absolute;
  inset:0;

  background:rgba(0,0,0,0.45);

  display:flex;
  justify-content:center;
  align-items:center;

  z-index:100;
}

.popup-box{

  background:white;

  padding:35px;

  border-radius:30px;

  text-align:center;

  width:320px;
}

.popup-box h2{
  margin-bottom:20px;
}

.popup-box input{

  width:220px;

  padding:12px;

  border-radius:14px;

  border:2px solid #ddd;

  font-size:18px;

  margin-top:10px;
}

.popup-box button{

  margin-top:20px;

  padding:14px 25px;

  border:none;

  border-radius:18px;

  background:#ff9800;

  color:white;

  font-size:18px;
  font-weight:bold;

  cursor:pointer;
}

/* tombol akhir */

.end-buttons{

  position:absolute;
  inset:0;

  display:none;

  justify-content:center;
  align-items:center;

  gap:20px;

  z-index:200;
}

.end-buttons button{

  padding:16px 28px;

  border:none;

  border-radius:22px;

  background:white;

  font-size:22px;
  font-weight:bold;

  cursor:pointer;

  box-shadow:
    0 5px 15px rgba(0,0,0,0.3);
}

/* camera */

#input_video{

  position:absolute;

  right:20px;
  bottom:20px;

  width:230px;

  border-radius:25px;

  border:5px solid white;

  z-index:50;
}

@media(max-width:768px){

  .title{

    font-size:32px;
    top:15px;
  }

  .leaderboard{

    width:160px;

    padding:12px;

    font-size:14px;
  }

  .leaderboard h3{

    font-size:18px;
  }

  .ui-box{

    font-size:16px;

    padding:10px 14px;
  }

  .popup-box{

    width:90%;
  }

  .popup-box input{

    width:90%;
  }

  #input_video{

    width:120px;

    right:10px;
    bottom:10px;
  }
}

</style>
</head>

<body>

<!-- popup -->

<div class="popup" id="startPopup">

  <div class="popup-box">

    <h2>🎮 Selamat Datang</h2>

    <p>Masukkan Nama Kamu 😊</p>

    <input
      id="playerName"
      type="text"
      placeholder="Nama pemain"
    >

    <br>

    <button onclick="startGame()">
      ▶ Mulai Bermain
    </button>

  </div>

</div>

<!-- title -->

<div class="title">
🫧🔫 Bubble Shooter 🔫🫧
</div>

<!-- kiri -->

<div class="left-ui">

  <div class="ui-box">
    ⭐ Score:
    <span id="score">0</span>/100
  </div>

  <div class="ui-box">
    ⏱ Waktu:
    <span id="timer">00:00</span>
  </div>

</div>

<!-- leaderboard -->

<div class="leaderboard">

  <h3>🏆 Top 3 Tercepat</h3>

  <div id="leaderboardList">
    Belum ada data
  </div>

</div>

<!-- combo -->

<div
  class="combo"
  id="comboText">
</div>

<!-- tombol akhir -->

<div
  id="endButtons"
  class="end-buttons">

  <button onclick="restartGame()">
    🔄 Main Lagi
  </button>

  <button onclick="goMenu()">
    🏠 Menu Utama
  </button>

</div>

<!-- kamera -->

<video
  id="input_video"
  autoplay
  playsinline>
</video>

<!-- canvas -->

<canvas id="game"></canvas>

<script>

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

canvas.width =
  window.innerWidth;

canvas.height =
  window.innerHeight;

/* CONFIG */

const radius =
  window.innerWidth < 768
  ? 18
  : 26;

const colors = [

  "#ff5c8a",
  "#5db7ff",
  "#ffd84d",
  "#5edc78"
];

const WIN_SCORE = 100;

/* GAME */

let playerName = "";

let gameStarted = false;
let gameOver = false;
let win = false;

let score = 0;
let seconds = 0;

let bullet = null;

/* BUBBLES */

const bubbles = [];

const cols = 8;

const spacingX = 58;
const spacingY = 50;

const startX =
  (canvas.width -
  ((cols-1)*spacingX))/2;

/* shooter */

const shooter = {

  x: canvas.width/2,
  y: canvas.height-90,

  angle: -Math.PI/2,

  bubble: randomColor()
};

/* RANDOM */

function randomColor(){

  return colors[
    Math.floor(
      Math.random()*colors.length
    )
  ];
}

/* GENERATE */

function generateStartBubbles(){

  bubbles.length = 0;

  for(let row=0; row<5; row++){

    for(let col=0; col<cols; col++){

      bubbles.push({

        x:
          startX +
          col*spacingX,

        y:
          120 +
          row*spacingY,

        color:
          randomColor()
      });
    }
  }
}

generateStartBubbles();

/* START */

function startGame(){

  const input =
    document.getElementById(
      "playerName"
    );

  if(input.value.trim() == ""){

    alert("Isi nama dulu 😊");
    return;
  }

  playerName =
    input.value;

  document.getElementById(
    "startPopup"
  ).style.display = "none";

  gameStarted = true;
}

/* TIMER */

setInterval(()=>{

  if(
    gameStarted &&
    !gameOver &&
    !win
  ){

    seconds++;

    const min =
      String(
        Math.floor(seconds/60)
      ).padStart(2,"0");

    const sec =
      String(
        seconds%60
      ).padStart(2,"0");

    document.getElementById(
      "timer"
    ).innerText =
      `${min}:${sec}`;
  }

},1000);

/* LEADERBOARD */

function saveLeaderboard(){

  const data =
    JSON.parse(
      localStorage.getItem(
        "bubbleLeaderboard"
      )
    ) || [];

  data.push({

    name:playerName,
    time:seconds
  });

  data.sort((a,b)=>
    a.time - b.time
  );

  data.splice(3);

  localStorage.setItem(

    "bubbleLeaderboard",

    JSON.stringify(data)
  );

  renderLeaderboard();
}

function renderLeaderboard(){

  const data =
    JSON.parse(
      localStorage.getItem(
        "bubbleLeaderboard"
      )
    ) || [];

  const el =
    document.getElementById(
      "leaderboardList"
    );

  if(data.length == 0){

    el.innerHTML =
      "Belum ada data";

    return;
  }

  el.innerHTML = "";

  data.forEach((p,i)=>{

    const min =
      String(
        Math.floor(p.time/60)
      ).padStart(2,"0");

    const sec =
      String(
        p.time%60
      ).padStart(2,"0");

    el.innerHTML += `
      <p>
        ${i+1}. ${p.name}
        - ${min}:${sec}
      </p>
    `;
  });
}

renderLeaderboard();

/* AIM MOUSE */

canvas.addEventListener(

  "mousemove",

  (e)=>{

    const dx =
      e.clientX - shooter.x;

    const dy =
      e.clientY - shooter.y;

    shooter.angle =
      Math.atan2(dy,dx);
  }
);

/* SHOOT */

canvas.addEventListener(

  "click",

  ()=>{

    shootBubble();
  }
);

function shootBubble(){

  if(
    !gameStarted ||
    gameOver ||
    win
  ) return;

  if(!bullet){

    bullet = {

      x: shooter.x,
      y: shooter.y,

      color:
        shooter.bubble,

      dx:
        Math.cos(
          shooter.angle
        ) * 13,

      dy:
        Math.sin(
          shooter.angle
        ) * 13
    };

    shooter.bubble =
      randomColor();
  }
}

/* DRAW BG */

function drawBackground(){

  const bg =
    ctx.createLinearGradient(
      0,0,
      0,canvas.height
    );

  bg.addColorStop(
    0,
    "#87CEEB"
  );

  bg.addColorStop(
    1,
    "#FFE7B0"
  );

  ctx.fillStyle = bg;

  ctx.fillRect(

    0,
    0,

    canvas.width,
    canvas.height
  );
}

/* DRAW BUBBLE */

function drawBubble(x,y,color){

  const g =
    ctx.createRadialGradient(

      x-8,
      y-8,
      5,

      x,
      y,
      radius
    );

  g.addColorStop(
    0,
    "white"
  );

  g.addColorStop(
    1,
    color
  );

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    radius,
    0,
    Math.PI*2
  );

  ctx.fillStyle = color;
  ctx.fill();

  ctx.strokeStyle =
    "white";

  ctx.lineWidth = 4;

  ctx.stroke();
}

/* AIM */

function drawAimLine(){

  let startX = shooter.x;
  let startY = shooter.y;

  let angle = shooter.angle;

  let dx = Math.cos(angle);
  let dy = Math.sin(angle);

  let x = startX;
  let y = startY;

  ctx.beginPath();

  ctx.moveTo(x,y);

  for(let i=0; i<900; i++){

    x += dx * 6;
    y += dy * 6;

    // bounce kiri kanan

    if(x <= radius){

      x = radius;
      dx *= -1;
    }

    if(x >= canvas.width-radius){

      x = canvas.width-radius;
      dx *= -1;
    }

    // berhenti kalau kena bubble

    let hit = false;

    for(let b of bubbles){

      const dist = Math.hypot(
        x - b.x,
        y - b.y
      );

      if(dist < radius*2){

        hit = true;
        break;
      }
    }

    ctx.lineTo(x,y);

    if(hit || y < 0){

      break;
    }
  }

  ctx.strokeStyle =
    "rgba(255,255,255,0.9)";

  ctx.lineWidth = 5;

  ctx.setLineDash([10,10]);

  ctx.stroke();

  ctx.setLineDash([]);
}

/* SHOOTER */

function drawShooter(){

  ctx.save();

  ctx.translate(
    shooter.x,
    shooter.y
  );

  ctx.rotate(
    shooter.angle
  );

  ctx.fillStyle =
    "white";

  ctx.beginPath();

  ctx.roundRect(
    0,
    -8,
    85,
    16,
    10
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    88,
    0,
    10,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "#ff9800";

  ctx.fill();

  ctx.restore();

  drawBubble(

    shooter.x,
    shooter.y,

    shooter.bubble
  );
}

/* NEIGHBORS */

function getNeighbors(target){

  return bubbles.filter(other=>{

    if(other === target)
      return false;

    const dx =
      target.x - other.x;

    const dy =
      target.y - other.y;

    const dist =
      Math.sqrt(dx*dx + dy*dy);

    return dist <= radius*2.6;
  });
}

/* MATCH */

function findMatches(startBubble){

  const stack = [startBubble];

  const visited = [];

  while(stack.length){

    const current =
      stack.pop();

    if(
      visited.includes(current)
    ) continue;

    visited.push(current);

    const neighbors =
      getNeighbors(current);

    neighbors.forEach(n=>{

      if(

        n.color ===
        startBubble.color &&

        !visited.includes(n)
      ){

        stack.push(n);
      }
    });
  }

  return visited;
}

/* FLOATING */

function removeFloatingBubbles(){

  const connected = [];

  function dfs(bubble){

    if(
      connected.includes(bubble)
    ) return;

    connected.push(bubble);

    getNeighbors(bubble)
    .forEach(n=>dfs(n));
  }

  bubbles.forEach(b=>{

    if(b.y <= 130){

      dfs(b);
    }
  });

  for(
    let i=bubbles.length-1;
    i>=0;
    i--
  ){

    if(
      !connected.includes(
        bubbles[i]
      )
    ){

      bubbles.splice(i,1);
    }
  }
}

/* COMBO */

function showCombo(count){

  let text = "";

  if(count >= 4 &&
     count <= 5){

    text =
      "🔥 COMBO x2 🔥";
  }

  else if(count >= 6 &&
          count <= 7){

    text =
      "🚀 COMBO x3 🚀";
  }

  else if(count >= 8){

    text =
      "💥 ULTRA COMBO 💥";
  }

  if(text != ""){

    document.getElementById(
      "comboText"
    ).innerText = text;

    setTimeout(()=>{

      document.getElementById(
        "comboText"
      ).innerText = "";

    },1500);
  }
}

/* NEW ROW */

setInterval(()=>{

  if(
    gameStarted &&
    !gameOver &&
    !win
  ){

    bubbles.forEach(b=>{

      b.y += 45;
    });

    for(let col=0;
        col<cols;
        col++){

      bubbles.push({

        x:
          startX +
          col*spacingX,

        y:100,

        color:
          randomColor()
      });
    }
  }

},30000);

/* UPDATE */

function update(){

  drawBackground();

  /* garis kalah */

  ctx.beginPath();

  ctx.moveTo(
    0,
    canvas.height-180
  );

  ctx.lineTo(
    canvas.width,
    canvas.height-180
  );

  ctx.strokeStyle =
    "red";

  ctx.lineWidth = 5;

  ctx.stroke();

  /* bubble */

  bubbles.forEach(b=>{

    drawBubble(
      b.x,
      b.y,
      b.color
    );

    if(
      b.y + radius >
      canvas.height-180
    ){

      gameOver = true;
    }
  });

  /* aim */

  drawAimLine();

  /* shooter */

  drawShooter();

  /* bullet */

  if(bullet){

    bullet.x += bullet.dx;
    bullet.y += bullet.dy;

    /* bounce */

    if(

      bullet.x <
      radius ||

      bullet.x >
      canvas.width-radius
    ){

      bullet.dx *= -1;
    }

    drawBubble(

      bullet.x,
      bullet.y,

      bullet.color
    );

    /* collision */

    for(let i=0;
        i<bubbles.length;
        i++){

      const b =
        bubbles[i];

      const dist =
        Math.hypot(

          bullet.x - b.x,
          bullet.y - b.y
        );

      if(
        dist <
        radius*2.2
      ){

        const angle =
          Math.atan2(

            bullet.y - b.y,
            bullet.x - b.x
          );

        const snapX =
          b.x +
          Math.cos(angle)
          * (radius*1.9);

        const snapY =
          b.y +
          Math.sin(angle)
          * (radius*1.9);

        bubbles.push({

          x:snapX,
          y:snapY,

          color:
            bullet.color
        });

        const newBubble =
          bubbles[
            bubbles.length-1
          ];

        const matches =
          findMatches(
            newBubble
          );

        if(matches.length >= 3){

          matches.forEach(m=>{

            const index =
              bubbles.indexOf(m);

            if(index !== -1){

              bubbles.splice(
                index,
                1
              );
            }
          });

          removeFloatingBubbles();

          showCombo(
            matches.length
          );

          let points = 10;

          if(matches.length >= 4 &&
             matches.length <=5){

            points = 20;
          }

          else if(matches.length >=6 &&
                  matches.length <=7){

            points = 30;
          }

          else if(matches.length >=8){

            points = 50;
          }

          score += points;

          if(score > 100)
            score = 100;

          document.getElementById(
            "score"
          ).innerText = score;

          if(score >= 100){

            win = true;

            saveLeaderboard();

            document.getElementById(
              "endButtons"
            ).style.display = "flex";
          }
        }

        bullet = null;

        break;
      }
    }

    /* kena atas */

    if(
      bullet &&
      bullet.y < radius
    ){

      bubbles.push({

        x:bullet.x,
        y:bullet.y,

        color:
          bullet.color
      });

      bullet = null;
    }
  }

  /* menang */

  if(win){

    ctx.fillStyle =
      "rgba(0,0,0,0.5)";

    ctx.fillRect(

      0,
      0,

      canvas.width,
      canvas.height
    );

    ctx.fillStyle =
      "white";

    ctx.font =
      "bold 60px Arial";

    ctx.textAlign =
      "center";

    ctx.fillText(

      `🎉 ${playerName} MENANG 🎉`,

      canvas.width/2,
      canvas.height/2 - 80
    );
  }

  /* kalah */

  if(gameOver){

    ctx.fillStyle =
      "rgba(0,0,0,0.5)";

    ctx.fillRect(

      0,
      0,

      canvas.width,
      canvas.height
    );

    ctx.fillStyle =
      "white";

    ctx.font =
      "bold 60px Arial";

    ctx.textAlign =
      "center";

    ctx.fillText(

      "💀 GAME OVER 💀",

      canvas.width/2,
      canvas.height/2 - 80
    );

    document.getElementById(
      "endButtons"
    ).style.display = "flex";
  }

  requestAnimationFrame(
    update
  );
}

update();

/* BUTTONS */

function restartGame(){

  location.reload();
}

function goMenu(){

  window.location.href =
    "index.html";
}

/* RESIZE */

window.addEventListener(

  "resize",

  ()=>{

    canvas.width =
      window.innerWidth;

    canvas.height =
      window.innerHeight;
  }
);

</script>

<!-- MEDIAPIPE -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

/* VIDEO */

const videoElement =
  document.getElementById(
    "input_video"
  );

/* HANDS */

const hands = new Hands({

  locateFile:(file)=>{

    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
  }
});

hands.setOptions({

  maxNumHands:1,

  modelComplexity:0,

  minDetectionConfidence:0.5,

  minTrackingConfidence:0.5
});

/* TRACK */

hands.onResults((results)=>{

  console.log(results.multiHandLandmarks);
  if(
    results.multiHandLandmarks &&
    results.multiHandLandmarks.length > 0
  ){

    const landmarks =
      results.multiHandLandmarks[0];

    /* telunjuk */

    const finger =
      landmarks[8];

    const handX =
  (1 - finger.x) * canvas.width;

    const handY =
      finger.y * canvas.height;

    const dx =
      handX - shooter.x;

    const dy =
      handY - shooter.y;

    shooter.angle =
      Math.atan2(dy,dx);

    /* pinch shoot */

    const thumb =
      landmarks[4];

    const pinch =
      Math.hypot(

        finger.x - thumb.x,
        finger.y - thumb.y
      );

    if(pinch < 0.05){

      shootBubble();
    }
  }
});

/* CAMERA */

const camera =
  new Camera(
    videoElement,
    {

      onFrame: async ()=>{

        await hands.send({

          image: videoElement
        });
      },

      width:640,
      height:480
    }
  );

camera.start();

</script>

</body>
</html>
